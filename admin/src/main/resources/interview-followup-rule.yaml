liteflow:
  rule-source: classpath:liteflow/interview-followup-chain.xml,classpath:liteflow/interview-score-aggregation-chain.xml

xunzhi-agent:
  interview:
    rule-engine:
      enable: true
      default-chain-id: default_followup_chain
      fail-open: true
      rule-version: v1.0.0
      default-max-follow-up: 2
      default-low-score-threshold: 60
    score-aggregation:
      enable: true
      default-chain-id: score_aggregation_chain
      fail-open: true
      rule-version: v1.0.0
      anchor-weights:
        correctness: 30
        completeness: 25
        logic: 20
        depth: 15
        clarity: 10
      status-factors:
        met: 1.0
        partial: 0.5
        missing: 0.0
        contradicted: 0.0
      critical-anchor-id: correctness
      critical-error-cap: 40
      excellent-threshold: 85
      qualified-threshold: 60
